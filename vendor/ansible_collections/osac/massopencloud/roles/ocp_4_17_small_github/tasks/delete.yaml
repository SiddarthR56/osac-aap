- name: Delete cluster
  ansible.builtin.import_role:
    name: osac.templates.ocp_4_17_small

- name: Delete VM load balancer service
  kubernetes.core.k8s:
    api_version: v1
    kind: Service
    name: "{{ compute_instance_name }}-load-balancer"
    namespace: "{{ tenant_target_namespace }}"
    state: absent
